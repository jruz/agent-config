processes:
  postgres:
    driver: docker
    docker:
      image: "postgres:18.1"
    env:
      PGPORT: "61001"
    health:
      command: "pg_isready --username=$POSTGRES_USER"
      interval_secs: 2
      timeout_secs: 15

  reset:
    type: oneshot
    driver: docker
    docker:
      image: app-reset
    command: "database reset -y"
    env:
      DATABASE_URL: "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:$POSTGRES_PORT/$POSTGRES_DB"
    depends_on:
      - postgres

  server:
    driver: docker
    docker:
      image: app-server
    depends_on:
      - reset
    health:
      command: "curl --fail --silent http://localhost:$APP_PORT/health"
      interval_secs: 2
      timeout_secs: 20

  playwright:
    driver: docker
    docker:
      image: app-playwright
      volumes:
        - "./playwright/screenshots:/app/playwright/screenshots"
        - "./test-results:/app/test-results"
    env:
      APP_DOMAIN: server
    depends_on:
      - server
