processes:
  postgres:
    command: just env-kill-ports pg-start
    health:
      command: just pg-ready
      interval_secs: 2
      timeout_secs: 10

  server:
    command: just sqlx-reset frontend-build rust-run
    depends_on: [postgres]
    health:
      command: curl --silent --fail http://localhost:$APP_PORT/
      interval_secs: 2
      timeout_secs: 15

  playwright:
    command: npx playwright test ${PLAYWRIGHT_ARGS:-}
    depends_on: [server]
    env:
      APP_DOMAIN: localhost
