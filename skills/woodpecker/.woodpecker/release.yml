when:
  - event: tag

steps:
  - name: BUILD_LINUX
    image: 127.0.0.1:5000/woodpecker-job:v0.0.15
    commands:
      - . /entrypoint.sh
      - nix develop --command rustup target add x86_64-unknown-linux-gnu
      - nix develop --command cargo build --release --target x86_64-unknown-linux-gnu
      - cp target/x86_64-unknown-linux-gnu/release/BINARY_NAME BINARY_NAME-linux-x86_64

  - name: BUILD_MACOS
    image: ghcr.io/rust-cross/cargo-zigbuild
    commands:
      - rustup target add x86_64-apple-darwin
      - rustup target add aarch64-apple-darwin
      - cargo zigbuild --release --target x86_64-apple-darwin
      - cargo zigbuild --release --target aarch64-apple-darwin
      - cp target/x86_64-apple-darwin/release/BINARY_NAME BINARY_NAME-macos-x86_64
      - cp target/aarch64-apple-darwin/release/BINARY_NAME BINARY_NAME-macos-arm64

  - name: RELEASE
    image: 127.0.0.1:5000/woodpecker-job:v0.0.15
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - ls -la BINARY_NAME-*
      - . /entrypoint.sh
      - nix develop --command just release-upload $${CI_COMMIT_TAG}
