when:
  - event: push
    branch: main
  - event: manual
  - event: pull_request

steps:
  - name: CHECK
    image: bash
    environment:
      REVISION: ${CI_COMMIT_SHA}
      SOPS_AGE_KEY:
        from_secret: SOPS_AGE_KEY
    commands:
      - nix develop --command just install
      - nix develop --command just check
