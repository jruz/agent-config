depends_on:
  - check
  - playwright
  - build-main

when:
  - event: push
    branch: main
  - event: manual
    branch: main

steps:
  - name: PUSH
    image: bash
    commands:
      - podman push 127.0.0.1:5000/${CI_REPO_NAME}:${CI_COMMIT_SHA}
      - podman push 127.0.0.1:5000/${CI_REPO_NAME}:main

  - name: DEPLOY
    image: bash
    environment:
      APP_DOMAIN: ${CI_REPO_NAME}.jruz.io
      REVISION: ${CI_COMMIT_SHA}
      STACK_NAME: ${CI_REPO_NAME}
      SOPS_AGE_KEY:
        from_secret: SOPS_AGE_KEY
      TAG: main
    commands:
      - >-
        nix develop --command bash -c '
        docker pull 127.0.0.1:5000/${CI_REPO_NAME}:main &&
        sops exec-env .env.prod.yaml
        "docker stack deploy
        --compose-file docker-compose.yaml
        --detach=false
        --prune
        --resolve-image always
        ${CI_REPO_NAME}"'
