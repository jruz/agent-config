when:
  - event: pull_request

steps:
  - name: BUILD FRONTEND
    image: bash
    commands:
      - nix develop --command just frontend-install
      - nix develop --command just frontend-build

  - name: BUILD BACKEND
    image: bash
    commands:
      - >-
        podman build
        --tag 127.0.0.1:5000/${CI_REPO_NAME}:pr-${CI_COMMIT_PULL_REQUEST}
        --label org.opencontainers.image.revision=${CI_COMMIT_SHA}
        .
