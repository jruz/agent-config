services:
  app:
    image: 127.0.0.1:5000/${STACK_NAME}:${TAG}
    environment:
      REVISION: ${REVISION}
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - traefik-public
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: stop-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.${STACK_NAME}.rule=Host(`${APP_DOMAIN}`)
        - traefik.http.routers.${STACK_NAME}.entrypoints=websecure
        - traefik.http.routers.${STACK_NAME}.tls.certresolver=le
        - traefik.http.routers.${STACK_NAME}.middlewares=vpn-only
        - traefik.http.services.${STACK_NAME}.loadbalancer.server.port=3000

  postgres:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

networks:
  traefik-public:
    external: true
  internal:
    external: true

volumes:
  postgres_data:
