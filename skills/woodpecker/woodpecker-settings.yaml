repo:
  name: jruz/REPO_NAME

secrets:
  CODEBERG_TOKEN:
    events:
      - tag
      - push
    value: ASK_USER
  SOPS_AGE_KEY:
    events:
      - push
      - pull_request
      - manual
    value: ASK_USER

settings:
  allow_deploy: false
  allow_pr: true
  cancel_previous_pipeline_events:
    - push
    - pull_request
  config_extension_endpoint: ""
  require_approval: forks
  timeout: 60
  visibility: public
  trusted:
    network: false
    security: false
    volumes: false
