extends: default

rules:
  document-end: disable
  document-start: disable
  line-length:
    max: 120
  truthy:
    check-keys: true
    allowed-values: ["true", "false", "yes", "no"]
  indentation:
    spaces: 2
    indent-sequences: consistent
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0
  comments:
    min-spaces-from-content: 1
  empty-lines:
    max: 1
  key-duplicates: enable
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  quoted-strings: disable
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    max-spaces-before: 0
    min-spaces-after: 1
  hyphens:
    max-spaces-after: 1
  new-line-at-end-of-file: enable
  trailing-spaces: enable
